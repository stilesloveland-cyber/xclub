name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Force Regenerate Wrapper and Build
        run: |
          echo "=== 1. 强制在 CI 服务器上就地生成官方纯净的 Wrapper ==="
          # 这行命令会强制下载官方标准的 gradle-wrapper.jar（约 50KB+），覆盖掉仓库里损坏的 32KB 文件
          gradle wrapper --gradle-version 8.10 --distribution-type bin
          
          echo "=== 2. 验证全新生成的 JAR 包大小 ==="
          ls -lh gradle/wrapper/gradle-wrapper.jar
          
          echo "=== 3. 开始执行 Android 编译 ==="
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xclub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Sync Server
        run: ./gradlew :sync-server:build

      - name: Upload Sync Server JAR
        uses: actions/upload-artifact@v4
        with:
          name: xclub-sync-server
          path: sync-server/build/libs/*.jar
