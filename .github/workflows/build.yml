name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
          validate-wrappers: false

      - name: Force Regenerate Wrapper
        run: |
          gradle wrapper --gradle-version 8.10 --distribution-type bin
          chmod +x gradlew
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: xclub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Sync Server
        run: ./gradlew :sync-server:build

      - name: Upload Sync Server JAR
        uses: actions/upload-artifact@v6
        with:
          name: xclub-sync-server
          path: sync-server/build/libs/*.jar
