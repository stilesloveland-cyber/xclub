name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 【已修复】删除了冲突的 actions/cache 步骤
      # 官方这个 action 会自动且安全地处理所有的 gradle 缓存及 gradlew 的权限问题
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

        - name: Verify Wrapper and Build
        run: |
          echo "=== 1. 查看当前目录下的所有文件（包含隐藏文件） ==="
          ls -la
          
          echo "=== 2. 查看 gradle/wrapper 目录结构 ==="
          ls -la gradle/wrapper || echo "❌ 警告：gradle/wrapper 目录不存在！"
          
          echo "=== 3. 检查 jar 包是否存在及其实际大小 ==="
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ 找到 jar 包，文件大小为："
            ls -lh gradle/wrapper/gradle-wrapper.jar
          else
            echo "❌ 严重错误：在 gradle/wrapper/ 下根本找不到 gradle-wrapper.jar！"
          fi

          echo "=== 4. 开始执行编译 ==="
          ./gradlew assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xclub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Sync Server
        run: ./gradlew :sync-server:build

      - name: Upload Sync Server JAR
        uses: actions/upload-artifact@v4
        with:
          name: xclub-sync-server
          path: sync-server/build/libs/*.jar
