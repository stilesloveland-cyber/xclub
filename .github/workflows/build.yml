name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Verify Wrapper and Build
        run: |
          echo "=== 1. 查看当前项目根目录 ==="
          ls -la
          
          echo "=== 2. 检查 gradle/wrapper 目录 ==="
          if [ -d "gradle/wrapper" ]; then
            ls -la gradle/wrapper
          else
            echo "❌ 警告：gradle/wrapper 目录在 CI 环境中不存在！"
          fi
          
          echo "=== 3. 校验 gradle-wrapper.jar 状态 ==="
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ 找到 jar 包，实际大小为："
            ls -lh gradle/wrapper/gradle-wrapper.jar
          else
            echo "❌ 严重错误：在 gradle/wrapper/ 下找不到 gradle-wrapper.jar 文件！"
          fi

          echo "=== 4. 开始执行 Android 编译 ==="
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xclub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Sync Server
        run: ./gradlew :sync-server:build

      - name: Upload Sync Server JAR
        uses: actions/upload-artifact@v4
        with:
          name: xclub-sync-server
          path: sync-server/build/libs/*.jar
