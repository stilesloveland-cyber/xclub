name: Android CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 【已修复】删除了冲突的 actions/cache 步骤
      # 官方这个 action 会自动且安全地处理所有的 gradle 缓存及 gradlew 的权限问题
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xclub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Sync Server
        run: ./gradlew :sync-server:build

      - name: Upload Sync Server JAR
        uses: actions/upload-artifact@v4
        with:
          name: xclub-sync-server
          path: sync-server/build/libs/*.jar
